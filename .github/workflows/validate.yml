name: Validate

on:
  push:
    # Tag pushes are validated by release.yml instead.
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Reused by release.yml so a tag is only published after it validates.
  workflow_call:

permissions: {}

jobs:
  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
